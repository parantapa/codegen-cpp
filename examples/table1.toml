[[table]]
name = "Measurement"
columns = [
    { name = "station_id", type = "i64" },
    { name = "sensor_id", type = "i32" },
    { name = "sequence", type = "i16" },
    { name = "quality", type = "i8" },
    { name = "reading_count", type = "u64" },
    { name = "error_count", type = "u32" },
    { name = "retry_count", type = "u16" },
    { name = "channel", type = "u8" },
    { name = "temperature", type = "f64" },
    { name = "humidity", type = "f32" },
    { name = "is_valid", type = "bool" },
    { name = "note", type = "str" },
]

[[table]]
name = "Station"
columns = [
    { name = "station_id", type = "i64" },
    { name = "name", type = "str" },
    { name = "latitude", type = "f64" },
    { name = "longitude", type = "f64" },
]

[[csv_reader]]
name = "MeasurementCsvReader"
table = "Measurement"
default = { quality = -1, humidity = 0.0, is_valid = false, note = "" }

[[csv_reader]]
name = "StationCsvReader"
table = "Station"

[[csv_reader]]
name = "StationImportCsvReader"
table = "Station"
name_in_file = { station_id = "Station ID", name = "Station Name" }
default = { latitude = 0.0, longitude = 0.0 }

[[parquet_reader]]
name = "MeasurementParquetReader"
table = "Measurement"
default = { quality = -1, note = "unknown" }

[[csv_writer]]
name = "MeasurementCsvWriter"
table = "Measurement"

[[csv_writer]]
name = "StationCsvWriter"
table = "Station"

[[csv_writer]]
name = "StationExportCsvWriter"
table = "Station"
name_in_file = { station_id = "Station ID", name = "Station Name" }

[[parquet_writer]]
name = "MeasurementParquetWriter"
table = "Measurement"
