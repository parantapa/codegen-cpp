# The datasets read and written by the C++ integration test 'test_hdf5'.

[[dataset]]
name = "Grid"
dims = ["row", "col"]
arrays = [
    { name = "temperature", type = "f64" },
    { name = "kind", type = "i32" },
    { name = "count", type = "u16" },
]

[[dataset]]
name = "Field"
dims = ["x", "y", "z"]
arrays = [
    { name = "value", type = "f32" },
    { name = "tag", type = "i8" },
]
column_major = true

[[hdf5_reader]]
name = "read_grid"
dataset = "Grid"

[[hdf5_reader]]
name = "read_grid_temperature"
dataset = "Grid"
include = ["temperature"]

[[hdf5_reader]]
name = "read_grid_labels"
dataset = "Grid"
exclude = ["temperature"]

[[hdf5_reader]]
name = "read_field"
dataset = "Field"

[[hdf5_writer]]
name = "write_grid"
dataset = "Grid"

[[hdf5_writer]]
name = "write_grid_temperature"
dataset = "Grid"
include = ["temperature"]

[[hdf5_writer]]
name = "write_field"
dataset = "Field"
