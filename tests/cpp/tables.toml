# The tables read and written by the C++ integration test 'test_readers'.

[[table]]
name = "Point"
columns = [
    { name = "id", type = "i64" },
    { name = "label", type = "str" },
    { name = "score", type = "f64" },
    { name = "flag", type = "bool" },
]

[[csv_reader]]
name = "PointCsvReader"
table = "Point"
default_values = { label = "missing", score = -1.5 }

[[parquet_reader]]
name = "PointParquetReader"
table = "Point"
default_values = { label = "missing", score = -1.5 }

[[csv_writer]]
name = "PointCsvWriter"
table = "Point"

[[parquet_writer]]
name = "PointParquetWriter"
table = "Point"
