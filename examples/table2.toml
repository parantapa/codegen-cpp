[[vector]]
name = "Keywords"
element = "str"

[[vector]]
name = "Positions"
element = "i32"

[[map]]
name = "Ids"
key = "str"
value = "str"

[[map]]
name = "CitationsByYear"
key = "i64"
value = "u32"
is_unordered = true

[[struct]]
name = "Biblio"
fields = [
    { name = "volume", type = "str" },
    { name = "issue", type = "str" },
    { name = "first_page", type = "i32" },
    { name = "last_page", type = "i32" },
]

[[struct]]
name = "OpenAccess"
fields = [
    { name = "is_oa", type = "bool" },
    { name = "status", type = "str" },
    { name = "url", type = "str" },
]

[[struct]]
name = "MentionPositions"
fields = [
    { name = "title", type = "Positions" },
    { name = "abstract", type = "Positions" },
    { name = "body", type = "Positions" },
]

[[struct]]
name = "TopicScore"
fields = [
    { name = "name", type = "str" },
    { name = "score", type = "f64" },
]

[[vector]]
name = "Topics"
element = "TopicScore"

[[vector]]
name = "Affiliations"
element = "Keywords"

[[table]]
name = "Work"
columns = [
    { name = "work_id", type = "i64" },
    { name = "title", type = "str" },
    { name = "keywords", type = "Keywords" },
    { name = "ids", type = "Ids" },
    { name = "biblio", type = "Biblio" },
    { name = "open_access", type = "OpenAccess" },
    { name = "topics", type = "Topics" },
    { name = "citations", type = "CitationsByYear" },
    { name = "mentions", type = "MentionPositions" },
    { name = "affiliations", type = "Affiliations" },
]

[[table]]
name = "WorkSummary"
columns = [
    { name = "work_id", type = "i64" },
    { name = "title", type = "str" },
    { name = "keyword_count", type = "u32" },
]

[[parquet_reader]]
name = "WorkParquetReader"
table = "Work"

[parquet_reader.name_in_file]
work_id = "id"
citations = "counts"
"open_access.status" = "oa_status"
"open_access.url" = "oa_url"
"topics.element.name" = "display_name"

[parquet_reader.default]
title = "unknown"
"keywords.element" = ""
"ids.value" = ""
"citations.value" = 0
"biblio.volume" = ""
"biblio.issue" = ""
"biblio.first_page" = -1
"biblio.last_page" = -1
"open_access.is_oa" = false
"open_access.status" = "unknown"
"open_access.url" = ""
"topics.element.name" = ""
"topics.element.score" = 0.0
"mentions.title.element" = -1
"mentions.abstract.element" = -1
"mentions.body.element" = -1
"affiliations.element.element" = ""

[[parquet_reader]]
name = "WorkSummaryParquetReader"
table = "WorkSummary"

[[parquet_writer]]
name = "WorkParquetWriter"
table = "Work"

[[parquet_writer]]
name = "WorkExportParquetWriter"
table = "Work"

[parquet_writer.name_in_file]
work_id = "id"
citations = "counts"
"open_access.status" = "oa_status"
"open_access.url" = "oa_url"
"topics.element.name" = "display_name"

[[csv_writer]]
name = "WorkSummaryCsvWriter"
table = "WorkSummary"

[[csv_writer]]
name = "WorkScalarCsvWriter"
table = "Work"
include = ["work_id", "title"]

[[parquet_writer]]
name = "WorkWithoutMentionsParquetWriter"
table = "Work"
exclude = ["mentions", "affiliations"]
