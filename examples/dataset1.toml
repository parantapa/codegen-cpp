[[dataset]]
name = "Series"
dims = ["sample"]
arrays = [
    { name = "timestamp", type = "i64" },
    { name = "value", type = "f64" },
    { name = "quality", type = "u16" },
]

[[dataset]]
name = "Raster"
dims = ["row", "col"]
arrays = [
    { name = "elevation", type = "f64" },
    { name = "slope", type = "f32" },
    { name = "population", type = "u32" },
    { name = "land_class", type = "u8" },
    { name = "region_id", type = "i32" },
    { name = "mask", type = "i8" },
]

[[dataset]]
name = "Volume"
dims = ["level", "row", "col"]
column_major = true
arrays = [
    { name = "density", type = "f32" },
    { name = "sample_count", type = "u64" },
    { name = "offset", type = "i16" },
]

[[hdf5_reader]]
name = "SeriesHdf5Reader"
dataset = "Series"

[[hdf5_reader]]
name = "RasterHdf5Reader"
dataset = "Raster"

[[hdf5_reader]]
name = "RasterMaskHdf5Reader"
dataset = "Raster"
include = ["mask"]

[[hdf5_reader]]
name = "RasterLayersHdf5Reader"
dataset = "Raster"
exclude = ["mask"]

[[hdf5_reader]]
name = "VolumeHdf5Reader"
dataset = "Volume"

[[hdf5_writer]]
name = "SeriesHdf5Writer"
dataset = "Series"

[[hdf5_writer]]
name = "RasterHdf5Writer"
dataset = "Raster"

[[hdf5_writer]]
name = "RasterMaskHdf5Writer"
dataset = "Raster"
include = ["mask"]

[[hdf5_writer]]
name = "RasterLayersHdf5Writer"
dataset = "Raster"
exclude = ["mask"]

[[hdf5_writer]]
name = "VolumeHdf5Writer"
dataset = "Volume"

[[hdf5_writer]]
name = "SeriesChunkedHdf5Writer"
dataset = "Series"
chunk = [65536]

[[hdf5_writer]]
name = "RasterCompressedHdf5Writer"
dataset = "Raster"
chunk = [512, 512]
compression = "deflate"
compression_level = 6
shuffle = true

[[hdf5_writer]]
name = "VolumeCompressedHdf5Writer"
dataset = "Volume"
chunk = [64, 64, 64]
compression = "zstd"
compression_level = 5
shuffle = true
