[[table]]
name = "ActivityLocationAssignment"
columns = [
    { name = "hid", type = "i64" },
    { name = "pid", type = "i64" },
    { name = "activity_number", type = "i16" },
    { name = "activity_type", type = "i16" },
    { name = "start_time", type = "i32" },
    { name = "duration", type = "i32" },
    { name = "lid", type = "i64" },
    { name = "latitude", type = "f64" },
    { name = "longitude", type = "f64" },
    { name = "travel_mode", type = "i8" },
    { name = "distance", type = "f64" },
]

[[csv_reader]]
name = "ActivityLocationAssignmentCsvReader"
table = "ActivityLocationAssignment"
default_values = {}

[[parquet_reader]]
name = "ActivityLocationAssignmentParquetReader"
table = "ActivityLocationAssignment"
default_values = {}
