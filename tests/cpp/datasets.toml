# The datasets read and written by the C++ integration test 'test_hdf5'.

[[dataset]]
name = "Grid"
dims = ["row", "col"]
arrays = [
    { name = "temperature", type = "f64" },
    { name = "kind", type = "i32" },
    { name = "count", type = "u16" },
]

[[dataset]]
name = "Field"
dims = ["x", "y", "z"]
arrays = [
    { name = "value", type = "f32" },
    { name = "tag", type = "i8" },
]
column_major = true

[[hdf5_reader]]
name = "read_grid"
dataset = "Grid"

[[hdf5_reader]]
name = "read_grid_temperature"
dataset = "Grid"
include = ["temperature"]

[[hdf5_reader]]
name = "read_grid_labels"
dataset = "Grid"
exclude = ["temperature"]

[[hdf5_reader]]
name = "read_field"
dataset = "Field"

[[hdf5_writer]]
name = "write_grid"
dataset = "Grid"

[[hdf5_writer]]
name = "write_grid_temperature"
dataset = "Grid"
include = ["temperature"]

[[hdf5_writer]]
name = "write_field"
dataset = "Field"

# The same arrays stored in chunks, and through the filters over them.
# A chunk on its own asks for no filter at all.
[[hdf5_writer]]
name = "write_grid_chunked"
dataset = "Grid"
chunk = [1, 2]

# 'deflate' is built into hdf5 and needs no plugin.
[[hdf5_writer]]
name = "write_grid_deflate"
dataset = "Grid"
chunk = [1, 2]
compression = "deflate"
compression_level = 9
shuffle = true

# 'zstd' is a filter that hdf5 loads at run time,
# and this chunk reaches past the array, so it is cut down to it.
[[hdf5_writer]]
name = "write_grid_zstd"
dataset = "Grid"
chunk = [64, 64]
compression = "zstd"
compression_level = 5
shuffle = true

# 'lz4' takes no level of its own.
[[hdf5_writer]]
name = "write_grid_lz4"
dataset = "Grid"
chunk = [2, 2]
compression = "lz4"

# A column major dataset is gathered before it is compressed.
[[hdf5_writer]]
name = "write_field_zstd"
dataset = "Field"
chunk = [1, 3, 4]
compression = "zstd"
shuffle = true
