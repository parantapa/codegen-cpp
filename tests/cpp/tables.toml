# The tables read and written by the C++ integration test 'test_readers'.

[[table]]
name = "Point"
columns = [
    { name = "id", type = "i64" },
    { name = "label", type = "str" },
    { name = "score", type = "f64" },
    { name = "flag", type = "bool" },
]

[[csv_reader]]
name = "PointCsvReader"
table = "Point"
default = { label = "missing", score = -1.5 }

# Reads the same table out of a file that names two of its columns
# the way no C++ member could be named.
[[csv_reader]]
name = "PointRenamingCsvReader"
table = "Point"
name_in_file = { id = "Point ID", score = "Score (mean)" }
default = { label = "missing", score = -1.5 }

[[parquet_reader]]
name = "PointParquetReader"
table = "Point"
default = { label = "missing", score = -1.5 }

# Reads the same table out of a Parquet file that names two of its columns
# the way no C++ member could be named.
[[parquet_reader]]
name = "PointRenamingParquetReader"
table = "Point"
name_in_file = { id = "Point ID", score = "Score (mean)" }
default = { label = "missing", score = -1.5 }

[[csv_writer]]
name = "PointCsvWriter"
table = "Point"

# Writes the names that the renaming readers look for,
# rather than the names that the table uses.
[[csv_writer]]
name = "PointRenamingCsvWriter"
table = "Point"
name_in_file = { id = "Point ID", score = "Score (mean)" }

[[parquet_writer]]
name = "PointParquetWriter"
table = "Point"

[[parquet_writer]]
name = "PointRenamingParquetWriter"
table = "Point"
name_in_file = { id = "Point ID", score = "Score (mean)" }

# Writes some of the columns of the table and leaves the rest out,
# so the file holds the columns of the writer rather than of the table.
[[csv_writer]]
name = "PointLabelCsvWriter"
table = "Point"
include = ["id", "label"]

[[parquet_writer]]
name = "PointLabelParquetWriter"
table = "Point"
exclude = ["score", "flag"]
